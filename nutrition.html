<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Good Life">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a5c45">
<link rel="manifest" href="manifest.json">
<title>Beslenme Planı — My Good Life</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f4ef;
  --surface: #fff;
  --card: #faf8f4;
  --border: #e8e2d8;
  --deep: #2c2416;
  --brown: #6b4c2a;
  --sage: #5a7a52;
  --sage-light: #e8f0e6;
  --terra: #b85c38;
  --terra-light: #f5ece7;
  --gold: #c4952a;
  --gold-light: #fdf3de;
  --blue: #3b6b8a;
  --blue-light: #e5eff5;
  --muted: #8a7f72;
  --subtle: #c8bfb0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--bg);
  color: var(--deep);
  font-size: 14px;
  line-height: 1.6;
}
/* HERO */
.hero {
  background: var(--deep);
  padding: 56px 52px 52px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -80px; right: -60px;
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px solid rgba(196,149,42,0.15);
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 30%;
  width: 180px; height: 180px;
  border-radius: 50%;
  border: 1px solid rgba(90,122,82,0.2);
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 18px;
}
.hero h1 {
  font-family: 'Lora', serif;
  font-size: 54px;
  font-weight: 400;
  color: #fff;
  line-height: 1.05;
}
.hero h1 em { font-style: italic; color: #e8c96a; }
.hero-desc {
  margin-top: 16px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  font-weight: 300;
  max-width: 500px;
  line-height: 1.7;
}
.hero-sources {
  margin-top: 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.src-tag {
  font-size: 10px;
  padding: 3px 10px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.5px;
}
/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--brown);
}
@media(max-width:700px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.stat {
  padding: 18px 20px;
  border-right: 1px solid rgba(255,255,255,0.1);
}
.stat:last-child { border-right: none; }
.stat-l { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 4px; }
.stat-v { font-family: 'Lora', serif; font-size: 20px; color: #fff; }
.stat-v small { font-family: 'Jost', sans-serif; font-size: 11px; color: rgba(255,255,255,0.4); }
/* WRAP */
.wrap { max-width: 980px; margin: 0 auto; padding: 0 40px 80px; }
/* SECTION */
.sec {
  margin-top: 52px;
}
.sec-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 6px;
}
.sec-title {
  font-family: 'Lora', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--deep);
}
.sec-pill {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
  background: var(--border);
  color: var(--muted);
}
.sec-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 20px;
  font-weight: 300;
}
/* TIMING */
.timing-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.t-step {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 140px;
}
.t-time {
  font-family: 'Lora', serif;
  font-size: 18px;
  color: var(--gold);
}
.t-name { font-size: 12px; font-weight: 500; color: var(--deep); margin: 3px 0; }
.t-note { font-size: 11px; color: var(--muted); line-height: 1.4; }
.t-warn { color: var(--terra); font-size: 10px; margin-top: 4px; }
/* TABS */
.meal-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.mtab {
  font-size: 12px;
  padding: 7px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-family: 'Jost', sans-serif;
  transition: all 0.18s;
}
.mtab:hover { border-color: var(--sage); color: var(--sage); }
.mtab.on { background: var(--deep); color: #fff; border-color: var(--deep); font-weight: 500; }
.tab-pane { display: none; }
.tab-pane.on { display: block; }
/* MACRO BANNER */
.mbanner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 24px;
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}
.mb-item { display: flex; flex-direction: column; gap: 2px; }
.mb-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.mb-val { font-family: 'Lora', serif; font-size: 22px; }
.mb-val.g { color: var(--sage); }
.mb-val.b { color: var(--blue); }
.mb-val.o { color: var(--terra); }
.mb-val.gold { color: var(--gold); }
.mb-sub { font-size: 10px; color: var(--muted); }
.mb-note { margin-left: auto; font-size: 12px; color: var(--muted); max-width: 200px; line-height: 1.5; }
/* MEAL CARD */
.meals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media(max-width:580px) { .meals-grid { grid-template-columns: 1fr; } }
.meals-grid.single { grid-template-columns: 1fr 1fr; }
.mc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.mc.span2 { grid-column: span 2; }
@media(max-width:580px) { .mc.span2 { grid-column: span 1; } }
.mc-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
}
.mc-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.mc-icon.sage { background: var(--sage-light); }
.mc-icon.gold { background: var(--gold-light); }
.mc-icon.terra { background: var(--terra-light); }
.mc-icon.blue { background: var(--blue-light); }
.mc-meta { flex: 1; }
.mc-day { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.mc-name { font-size: 14px; font-weight: 500; color: var(--deep); margin-top: 1px; }
.mc-nums {
  text-align: right;
  flex-shrink: 0;
}
.mc-kcal { font-family: 'Lora', serif; font-size: 18px; color: var(--gold); }
.mc-pfc { font-size: 10px; color: var(--muted); margin-top: 1px; }
.mc-body { padding: 13px 16px; }
.mc-body ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.mc-body li {
  font-size: 12.5px; color: #5a5248;
  display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
}
.mc-body li::before { content: '·'; color: var(--subtle); font-size: 16px; line-height: 1; flex-shrink: 0; margin-top: 0px; }
.mc-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.mtag { font-size: 10px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
.mtag.p { border-color: #b8d4b4; color: var(--sage); }
.mtag.c { border-color: #b4cad8; color: var(--blue); }
.mtag.warn { border-color: #e8c9b8; color: var(--terra); }
.mtag.ok { border-color: #b8d4b4; color: var(--sage); background: var(--sage-light); }
.mc-note {
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--card);
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.5;
}
/* MACRO TABLE */
.macro-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin-top: 6px;
}
.macro-tbl th {
  text-align: left;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 10px 8px 0;
  font-weight: 400;
  border-bottom: 1px solid var(--border);
}
.macro-tbl td {
  padding: 8px 10px 8px 0;
  border-bottom: 1px solid rgba(232,226,216,0.5);
  vertical-align: middle;
  color: var(--deep);
}
.macro-tbl tr:last-child td { border-bottom: none; }
.tbl-num {
  font-size: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 6px;
  color: var(--muted);
  display: inline-block;
  font-weight: 500;
}
.p-val { color: var(--sage); font-weight: 500; }
.k-val { color: var(--blue); font-weight: 500; }
.y-val { color: var(--terra); font-weight: 500; }
.kcal-val { font-family: 'Lora', serif; font-size: 15px; color: var(--gold); }
.tbl-note { font-size: 10.5px; color: var(--muted); font-style: italic; }
.best-tag {
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--sage-light);
  color: var(--sage);
  border: 1px solid #b8d4b4;
}
/* WEEKLY TABLE */
.week-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.week-tbl th {
  background: var(--deep);
  color: rgba(255,255,255,0.7);
  padding: 10px 14px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 400;
}
.week-tbl td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
  color: var(--deep);
}
.week-tbl tr:last-child td { border-bottom: none; }
.week-tbl tr:nth-child(even) td { background: var(--card); }
.day-cell { font-weight: 600; font-size: 11px; letter-spacing: 0.5px; color: var(--brown); white-space: nowrap; }
.macro-cell { font-size: 11px; color: var(--muted); white-space: nowrap; }
/* SWEETS */
.sweet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
@media(max-width:580px) { .sweet-grid { grid-template-columns: 1fr; } }
.sweet-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 18px;
}
.sweet-icon { font-size: 24px; margin-bottom: 10px; }
.sweet-name { font-size: 14px; font-weight: 500; color: var(--deep); margin-bottom: 8px; }
.sweet-steps { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.sweet-steps li { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
.sweet-steps li::before { content: '→'; color: var(--subtle); flex-shrink: 0; }
.sweet-macro {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.sm { font-size: 10px; padding: 2px 9px; border-radius: 20px; }
.sm.kcal { background: var(--gold-light); color: var(--gold); }
.sm.p { background: var(--sage-light); color: var(--sage); }
.sm.note { background: var(--blue-light); color: var(--blue); }
/* ALERT */
.alert {
  background: var(--terra-light);
  border: 1px solid #e8c9b8;
  border-left: 3px solid var(--terra);
  border-radius: 0 10px 10px 0;
  padding: 12px 18px;
  font-size: 12.5px;
  color: #7a3d25;
  line-height: 1.6;
  margin: 28px 0 0;
}
.alert strong { color: var(--terra); }
/* BESIN REF */
.ref-tbl-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-top: 8px;
}
.ref-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.ref-tbl th {
  background: var(--card);
  padding: 8px 14px;
  text-align: left;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  border-bottom: 1px solid var(--border);
}
.ref-tbl td {
  padding: 8px 14px;
  border-bottom: 1px solid rgba(232,226,216,0.5);
  color: var(--deep);
}
.ref-tbl tr:last-child td { border-bottom: none; }
.ref-tbl tr:nth-child(even) td { background: var(--card); }
.src-badge {
  font-size: 9px;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--blue-light);
  color: var(--blue);
  margin-left: 4px;
}
/* DIVIDER */
.div { height: 1px; background: var(--border); margin: 40px 0; }
/* FOOTER */
footer {
  text-align: center;
  padding: 28px;
  font-size: 11px;
  color: var(--subtle);
  border-top: 1px solid var(--border);
  line-height: 1.7;
}
.print-btn {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  padding: 6px 18px;
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  background: var(--surface);
  color: var(--muted);
  font-family: 'Jost', sans-serif;
  transition: all 0.2s;
}
.print-btn:hover { background: var(--deep); color: #fff; border-color: var(--deep); }
@media print {
  .meal-tabs, .print-btn { display: none; }
  .tab-pane { display: block !important; }
}
</style>
</head>
